<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 514" width="960" height="514">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#323c42"/>
      <stop offset="60%" stop-color="#21272b"/>
      <stop offset="100%" stop-color="#14181a"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="960" height="514" fill="url(#heroGrad)"/>
  <!-- Decorative abstract architecture silhouettes -->
  <g opacity="0.25">
    <polygon points="120,514 180,180 280,160 340,514" fill="#ffffff"/>
    <polygon points="300,514 360,240 440,210 500,514" fill="#ffffff"/>
    <polygon points="650,514 720,120 820,140 880,514" fill="#ffffff"/>
  </g>
  <rect width="960" height="514" fill="url(#overlayGrad)"/>
</svg>
